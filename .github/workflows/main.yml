name: Build HSK Screen Tutor & Deploy Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip project files
      run: |
        if [ -f HSK_screen_project.zip ]; then
          unzip -o HSK_screen_project.zip
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle 8.4
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HSK-Screen-Tutor-v1.0.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

  deploy_pages:
    name: Deploy Web App for iPhone
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip project files
      run: |
        if [ -f HSK_screen_project.zip ]; then
          unzip -o HSK_screen_project.zip
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Prepare Pages directory
      run: |
        if [ ! -d docs ]; then
          mkdir -p docs
          cp -r web_preview/* docs/ 2>/dev/null || true
        fi

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'docs'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

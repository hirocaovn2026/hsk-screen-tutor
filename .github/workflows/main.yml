name: Build HSK Screen Tutor APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip project files
      run: |
        if [ -f HSK_screen_project.zip ]; then
          unzip -o HSK_screen_project.zip
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Ensure Gradle Wrapper and Permissions
      run: |
        mkdir -p gradle/wrapper
        curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar
        sed -i -e 's/\r$//' gradlew || true
        chmod +x gradlew
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HSK-Screen-Tutor-v1.0.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
